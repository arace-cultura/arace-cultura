<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aracê | Login</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="preload" href="./assets/img/bg_page_ini.jpg" as="image" />

</head>

<body>
    <img src="./assets/img/bg_pedra_azul.jpg" class="bg_page" alt="Background">

    <main>
        <div class="container-flex">
            <form action="#" method="POST" class="forms-blur">
                <h1>Login</h1>
                <div>
                    <input type="email" class="input-style-perfil" placeholder="E-mail">
                    <input type="password" class="input-style-senha" placeholder="Senha">
                    <button type="submit">
                        Entrar
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
